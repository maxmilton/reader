"$schema" = "https://www.schemastore.org/bunfig.json"

[run]
bun = true
noOrphans = true

[install]
auto = "disable"
linker = "isolated"
hoistPattern = ["@csstools/*", "postcss*"] # no phantom dependencies
peer = false
minimumReleaseAge = 604800 # 7 days
minimumReleaseAgeExcludes = [
  "@ekscss/framework",
  "@maxmilton/*",
  "bugbox",
  "ekscss",
  "stage1",
  # TODO: Remove this once bun supports wildcards
  "@maxmilton/html-parser",
  "@maxmilton/oxlint-config",
  "@maxmilton/stylelint-config",
  "@maxmilton/test-utils",
]

[test]
preload = ["./test/setup.ts"]
root = "./test/unit"
