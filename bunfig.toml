"$schema" = "https://www.schemastore.org/bunfig.json"

[run]
bun = true
noOrphans = true

[install]
auto = "disable"
peer = false
ignoreScripts = true
linker = "isolated"
minimumReleaseAge = 604800 # 7 days
minimumReleaseAgeExcludes = [
  "@ekscss/config-loader",
  "@ekscss/framework",
  "@ekscss/plugin-apply",
  "@ekscss/plugin-import",
  "@ekscss/plugin-prefix",
  "@maxmilton/html-parser",
  "@maxmilton/oxlint-config",
  "@maxmilton/stylelint-config",
  "@maxmilton/test-utils",
  "bugbox",
  "bun-plugin-ekscss",
  "ekscss",
  "stage1",
]
hoistPattern = [ # no surprise phantom dependencies
  "@csstools/css-parser-algorithms",
  "@csstools/css-tokenizer",
  "postcss",
  "postcss-ekscss",
  "postcss-selector-parser",
]

[test]
preload = ["./test/setup.ts"]
root = "./test/unit"
