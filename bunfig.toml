"$schema" = "https://www.schemastore.org/bunfig.json"

[run]
bun = true
noOrphans = true

[install]
auto = "disable"
linker = "isolated"
peer = false
minimumReleaseAge = 604800 # 7 days
minimumReleaseAgeExcludes = [
  "@ekscss/framework",
  "@maxmilton/*",
  "bugbox",
  "ekscss",
  "stage1",
  "@maxmilton/html-parser", # TODO: Remove this once bun supports wildcards
]

[test]
preload = ["./test/setup.ts"]
root = "./test/unit"
